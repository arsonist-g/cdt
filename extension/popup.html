<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: "Segoe UI", -apple-system, sans-serif;
        width: 300px;
        margin: 0;
        padding: 12px;
        font-size: 13px;
        color: #222;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 5px 0;
      }
      .dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 50%;
        margin-right: 6px;
        vertical-align: middle;
        background: #999;
      }
      .dot.connecting {
        background: #f0ad4e;
      }
      .dot.connected,
      .dot.sent {
        background: #5cb85c;
      }
      .dot.done {
        background: #337ab7;
      }
      .dot.error {
        background: #d9534f;
      }
      .muted {
        color: #888;
        font-size: 12px;
      }
      .logs {
        background: #f5f5f5;
        border-radius: 4px;
        padding: 6px;
        height: 130px;
        overflow-y: auto;
        font-family: Consolas, "Courier New", monospace;
        font-size: 11px;
        white-space: pre-wrap;
        margin-top: 8px;
        color: #444;
      }
      button {
        margin-top: 8px;
        width: 100%;
        padding: 7px;
        cursor: pointer;
        border: 1px solid #ccc;
        border-radius: 4px;
        background: #fff;
        font-size: 13px;
      }
      button:hover {
        background: #f0f0f0;
      }
    </style>
  </head>
  <body>
    <h1>CDT Bridge</h1>
    <div class="row">
      <span><span id="dot" class="dot"></span><span id="status">idle</span></span>
      <span id="count" class="muted">0 cookie</span>
    </div>
    <div class="row"><span class="muted">ws</span><span id="ws" class="muted">-</span></div>
    <div class="row"><span class="muted">last</span><span id="last" class="muted">-</span></div>
    <div class="logs" id="logs">(等待日志…)</div>
    <button id="reset">重新拉取</button>
    <script src="popup.js"></script>
  </body>
</html>
